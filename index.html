<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corinthians Fan Page</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}

header{
    background:black;
    padding:30px;
    border-bottom:4px solid white;
}

h1{
    font-size:45px;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    cursor:pointer;
    border-radius:10px;
    background:white;
    color:black;
    margin:20px;
}

button:hover{
    transform:scale(1.05);
}

.card{
    background:#222;
    margin:20px auto;
    width:300px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(255,255,255,.2);
}

.dark{
    background:white;
    color:black;
}

.dark header{
    background:#333;
    color:white;
}
</style>

</head>

<body>

<header>
<h1>🦅 Corinthians Fan Page</h1>
<p>Vai Corinthians!</p>
</header>

<div class="card">
<h2>Títulos Brasileiros</h2>
<h1 id="titulos">7</h1>
<button onclick="somar()">+1 (simulação)</button>
</div>

<button onclick="modoEscuro()">
Alternar Tema
</button>

<script>

function somar(){
let t=document.getElementById("titulos");
t.innerHTML=parseInt(t.innerHTML)+1;
}

function modoEscuro(){
document.body.classList.toggle("dark");
}

</script>

</body>
</html>
